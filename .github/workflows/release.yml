name: Release

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_PATH: 'src/LinkValidator'

jobs:
  build:
    name: Build ${{ matrix.rid }} Native AOT Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            archive-name: 'link-validator-linux-x64'
            archive-ext: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            archive-name: 'link-validator-linux-arm64'
            archive-ext: tar.gz
          - os: windows-latest
            rid: win-x64
            archive-name: 'link-validator-windows-x64'
            archive-ext: zip

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        global-json-file: global.json

    - name: Update version info from release notes
      run: pwsh ./build.ps1

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish Native AOT binary
      shell: bash
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} \
          -c Release \
          -r ${{ matrix.rid }} \
          -p:PublishAot=true \
          -o publish/${{ matrix.rid }}

    - name: Package archive
      shell: bash
      run: |
        cd publish/${{ matrix.rid }}
        if [ "${{ matrix.rid }}" == "win-x64" ]; then
          zip -r ../../${{ matrix.archive-name }}.zip link-validator.exe
        else
          tar -czf ../../${{ matrix.archive-name }}.tar.gz link-validator
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.archive-name }}
        path: |
          ${{ matrix.archive-name }}.zip
          ${{ matrix.archive-name }}.tar.gz
        if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: artifacts

    - name: Extract version from tag
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Read release notes
      id: release_notes
      run: |
        if [ -f "RELEASE_NOTES.md" ]; then
          {
            echo "notes<<RELEASE_NOTES_DELIMITER"
            cat RELEASE_NOTES.md
            echo "RELEASE_NOTES_DELIMITER"
          } >> $GITHUB_OUTPUT
        else
          echo "notes=Release ${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        name: ${{ steps.version.outputs.version }}
        body: ${{ steps.release_notes.outputs.notes }}
        files: |
          artifacts/**/*.zip
          artifacts/**/*.tar.gz
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
