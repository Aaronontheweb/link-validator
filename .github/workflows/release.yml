name: Release

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_PATH: 'src/LinkValidator'

jobs:
  build:
    name: Build ${{ matrix.rid }} Native AOT Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            installer-platform: linux-x64
            archive-name: 'link-validator-linux-x64'
            archive-ext: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            installer-platform: linux-arm64
            archive-name: 'link-validator-linux-arm64'
            archive-ext: tar.gz
          - os: windows-latest
            rid: win-x64
            installer-platform: windows-x64
            archive-name: 'link-validator-windows-x64'
            archive-ext: zip
          - os: macos-15
            rid: osx-arm64
            installer-platform: macos-arm64
            archive-name: 'link-validator-macos-arm64'
            archive-ext: tar.gz

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json

    - name: Update version info from release notes
      run: pwsh ./build.ps1

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish Native AOT binary
      shell: bash
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} \
          -c Release \
          -r ${{ matrix.rid }} \
          -p:PublishAot=true \
          -o publish/${{ matrix.rid }}

    - name: Package Unix archive
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd publish/${{ matrix.rid }}
        tar -czf ../../${{ matrix.archive-name }}.${{ matrix.archive-ext }} link-validator

    - name: Package Windows archive
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive `
          -Path publish/${{ matrix.rid }}/link-validator.exe `
          -DestinationPath ${{ matrix.archive-name }}.${{ matrix.archive-ext }}

    - name: Validate Unix archive through installer
      if: runner.os != 'Windows'
      shell: bash
      env:
        LINK_VALIDATOR_SMOKE_ARCHIVE: ${{ github.workspace }}/${{ matrix.archive-name }}.${{ matrix.archive-ext }}
        LINK_VALIDATOR_SMOKE_PLATFORM: ${{ matrix.installer-platform }}
      run: bash scripts/smoke/install-smoke.sh

    - name: Validate Windows archive through installer
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        LINK_VALIDATOR_SMOKE_ARCHIVE: ${{ github.workspace }}/${{ matrix.archive-name }}.${{ matrix.archive-ext }}
      run: ./scripts/smoke/install-smoke.ps1

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.archive-name }}
        path: |
          ${{ matrix.archive-name }}.zip
          ${{ matrix.archive-name }}.tar.gz
        if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: artifacts

    - name: Extract version from tag
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Extract latest release notes
      shell: pwsh
      run: |
        $content = Get-Content RELEASE_NOTES.md -Raw
        # Match from the first #### heading to just before the second one
        if ($content -match '(?s)(####.+?)(?=\n####|\z)') {
          $Matches[1].Trim() | Set-Content RELEASE_NOTES_LATEST.md
        } else {
          $content | Set-Content RELEASE_NOTES_LATEST.md
        }

    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        name: ${{ steps.version.outputs.version }}
        body_path: RELEASE_NOTES_LATEST.md
        files: |
          artifacts/**/*.zip
          artifacts/**/*.tar.gz
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
